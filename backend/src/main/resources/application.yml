spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:win_tools}?characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never

logging:
  file:
    path: ${WIN_TOOLS_LOG_DIR:logs}

management:
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      exposure:
        include: health,info
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
    info:
      access: read-only

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

# Reference for the effective prod settings. The active files are
# backend/src/main/resources/application.yml and application-prod.yml.
# Keep real credentials only in /etc/win-tools/win-tools.env.
spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:win_tools}?characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never
  mvc:
    log-request-details: false

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-exception: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  tomcat:
    accesslog:
      enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  file:
    path: ${WIN_TOOLS_LOG_DIR:logs}
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.mybatis: INFO
    com.baomidou: INFO
    com.xiaoc.backend: INFO

management:
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      exposure:
        include: health,info
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
    info:
      access: read-only

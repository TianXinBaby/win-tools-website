name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 18
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '18'
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw
      - name: Run tests
        run: ./mvnw test
      - name: Verify and build Jar
        run: ./mvnw verify
